{% extends 'layout.html' %}

{% block head %}
    <title> Dicionário Médico - {{ designacao }} </title>
{% endblock %}

{% block body %}


<div class="container mt-5 mb-5">
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="card shadow-sm border-primary border-top border-4 rounded-4">
                <div class="card-body p-5">
                    
                    <h1 class="card-title text-primary fw-bold mb-4">{{ designacao }}</h1>
                    
                    <p class="card-text fs-4 lh-base text-dark">
                        {{ descricao }}
                    </p>
                    
                    <hr class="my-4 text-muted">
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/conceitos" class="btn btn-outline-primary">
                            &larr; Voltar à Lista
                        </a>
                        <a href="/" class="btn btn-sm btn-link text-secondary text-decoration-none">
                            Ir para a Home
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
